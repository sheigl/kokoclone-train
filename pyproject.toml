[project]
name = "kokoclone-train"
version = "0.1.0"
description = "RVC v2 training pipeline for KokoClone voice cloning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.7.0",
    "huggingface-hub>=1.5.0",
    "librosa>=0.10.0",
    "ninja>=1.13.0",
    "numpy>=1.26.0",
    "pyworld>=0.3.4",
    "scipy>=1.11.0",
    "soundfile>=0.13.1",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchvision>=0.15.0",
    "transformers>=4.40.0",
    "tqdm>=4.65.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
]
xpu = [
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
]
test = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-xpu", extra = "xpu" },
]
torchaudio = [
    { index = "pytorch-xpu", extra = "xpu" },
]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[tool.setuptools.packages.find]
include = ["kokoclone_train*"]

[tool.uv]
package = true
no-build-isolation-package = ["flash-attn"]
conflicts = [
    [
        { extra = "gpu" },
        { extra = "xpu" },
    ],
]

[project.scripts]
kokoclone-train = "kokoclone_train.__main__:_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]